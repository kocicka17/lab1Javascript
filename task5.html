<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 1 — Завдання 5</title>
</head>
<body>
    <script>
        let k = 3, l = 11;
        let S = 0;
        for (let m = k; m <= l; m++) {
            S += (2 * m - 1) / (m + 4);
        }
        console.log("S =", S);

        let n = 8;
        let Z = 1;
        for (let i = 1; i <= n; i++) {
            Z *= Math.pow(-1, i) * (i + 6) / (i + 8);
        }
        console.log("Z =", Z);
    </script>
</body>
</html>
