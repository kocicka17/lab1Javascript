<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 1 — Завдання 3</title>
</head>
<body>
    <script>
        let x = 2.5;
        let y;
        if (x <= 1) {
            y = Math.cos(Math.PI * x);
        } else if (x > 1 && x < 4) {
            y = Math.pow(x, 2) - 1;
        } else {
            y = 2 * Math.sqrt(x);
        }
        console.log("x =", x, ", y =", y);
    </script>
</body>
</html>
