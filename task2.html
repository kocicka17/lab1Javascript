<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 1 — Завдання 2</title>
</head>
<body>
    <script>
        let p = 1.15;
        let a = Math.exp(-2 * p);
        let b = Math.log10(Math.abs(p - 3));
        let k = Math.log(Math.abs(a + b)) - Math.pow(Math.cos(a - b), 2);
        console.log("p =", p);
        console.log("a =", a);
        console.log("b =", b);
        console.log("k =", k);
    </script>
</body>
</html>
