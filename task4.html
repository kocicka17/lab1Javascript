<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота 1 — Завдання 4</title>
</head>
<body>
    <script>
        function y(x) {
            return (Math.pow(x, 2) - 2 * x) / Math.sqrt(x + 6);
        }

        // а) табулювання на відрізку [1; 5] з кроком 0.4
        console.log("Частина а):");
        let a = 1, b = 5, dx = 0.4;
        for (let x = a; x <= b + 1e-9; x += dx) {
            console.log(`x = ${x.toFixed(3)}, y = ${y(x).toFixed(5)}`);
        }

        // б) n значень, починаючи з x0 = 2
        console.log("Частина б):");
        let x0 = 2, dx2 = 0.3, n = 5;
        let x = x0, i = 0;
        while (i < n) {
            console.log(`x = ${x.toFixed(3)}, y = ${y(x).toFixed(5)}`);
            x += dx2;
            i++;
        }
    </script>
</body>
</html>
